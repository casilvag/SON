<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Nueva Inscripción - Academy Son</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .header { background: #1a1a1a; color: white; padding: 20px; text-align: center; }
        .content { padding: 20px; background: #f9f9f9; }
        .field { margin-bottom: 15px; padding: 10px; background: white; border-left: 4px solid #fbbf24; }
        .label { font-weight: bold; color: #1a1a1a; }
        .value { margin-top: 5px; }
        .details { background: white; padding: 15px; border-radius: 5px; white-space: pre-line; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎵 Nueva Inscripción - Academy Son</h1>
    </div>
    
    <div class="content">
        <div class="field">
            <div class="label">Nombre Completo:</div>
            <div class="value">{{campo1}}</div>
        </div>
        
        <div class="field">
            <div class="label">Correo Electrónico:</div>
            <div class="value">{{campo2}}</div>
        </div>
        
        <div class="field">
            <div class="label">Teléfono:</div>
            <div class="value">{{campo3}}</div>
        </div>
        
        <div class="field">
            <div class="label">Detalles de la Inscripción:</div>
            <div class="details">{{campo4}}</div>
        </div>
    </div>
</body>
</html>
