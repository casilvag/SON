<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Nueva Inscripción - Academy SON</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: linear-gradient(135deg, #f59e0b, #ef4444); color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { background: #f9f9f9; padding: 20px; border-radius: 0 0 8px 8px; }
        .field { margin-bottom: 15px; }
        .label { font-weight: bold; color: #1f2937; }
        .value { background: white; padding: 10px; border-radius: 4px; border-left: 4px solid #f59e0b; }
        .message-section { background: white; padding: 15px; border-radius: 8px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 Nueva Solicitud de Inscripción</h1>
            <p>Academy SON - Escuela de Música</p>
        </div>
        
        <div class="content">
            <div class="field">
                <div class="label">Nombre Completo:</div>
                <div class="value">{{nom}}</div>
            </div>
            
            <div class="field">
                <div class="label">Correo Electrónico:</div>
                <div class="value">{{email}}</div>
            </div>
            
            <div class="field">
                <div class="label">Teléfono:</div>
                <div class="value">{{telephone}}</div>
            </div>
            
            <div class="message-section">
                <div class="label">Detalles de la Inscripción:</div>
                <div style="white-space: pre-line; margin-top: 10px;">{{message}}</div>
            </div>
        </div>
    </div>
</body>
</html>
